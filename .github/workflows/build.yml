name: Build CamTuner.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name CamTuner
          --collect-all pyvirtualcam --collect-all pygrabber --collect-all pystray --hidden-import usage
          camtuner.py

      - uses: actions/upload-artifact@v4
        with:
          name: CamTuner-exe
          path: dist/CamTuner.exe
